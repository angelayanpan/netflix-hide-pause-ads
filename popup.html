<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #141414;
      color: #fff;
      width: 200px;
      padding: 16px;
      margin: 0;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 12px;
      color: #e50914;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      flex-shrink: 0;
    }
    .label {
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h2>Hide Pause Ads</h2>
  <div class="row">
    <div class="dot"></div>
    <span class="label">Active on Netflix</span>
  </div>
</body>
</html>
